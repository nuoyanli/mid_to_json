<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>MIDI 转 JSON（ZIP 下载 + 单文件）</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      margin: 0;
      padding-top: 60px;
    }
    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }
    button {
      background-color: #4a90e2;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      margin: 0 auto 12px auto;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #357ab8;
    }
    ul#fileList {
      list-style-type: none;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    ul#fileList li {
      margin-bottom: 10px;
      background: #f7f9fc;
      padding: 10px 14px;
      border-left: 4px solid #4a90e2;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 MIDI 提取和弦工具</h1>
    <button id="selectFolderBtn">📁 批量选择文件夹（ZIP 下载）</button>
    <button id="selectSingleBtn">🎵 选择单个 MIDI 文件（立即下载）</button>
    <ul id="fileList"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const selectFolderBtn = document.getElementById("selectFolderBtn");
    const selectSingleBtn = document.getElementById("selectSingleBtn");
    const fileList = document.getElementById("fileList");

    selectFolderBtn.onclick = async () => {
      const dirHandle = await window.showDirectoryPicker();
      const zip = new JSZip();
      let processedCount = 0;

      for await (const entry of dirHandle.values()) {
        if (entry.kind === "file" && entry.name.endsWith(".mid")) {
          const file = await entry.getFile();
          const arrayBuffer = await file.arrayBuffer();
          try {
            const midi = new Midi(arrayBuffer);
            const jsonData = midi.toJSON();

            const meta = jsonData.header.meta?.filter(item => item.type === "marker") || [];
            const metaList = meta.map(item => ({ text: item.text, ticks: item.ticks }));
            const ppq = jsonData.header.ppq;
            const bpm = jsonData.header.tempos?.[0]?.bpm || 120;
            const name = jsonData.header.name || entry.name;
            const tickTime = 60 / (bpm * ppq);

            const result = {
              name: name,
              audio_name: entry.name,
              count: metaList.length,
              chords: []
            };

            for (let i = 0; i < metaList.length; i++) {
              const current = metaList[i];
              const nextTicks = metaList[i + 1]?.ticks || current.ticks + ppq;
              result.chords.push({
                name: current.text,
                time_start: current.ticks * tickTime,
                time_end: nextTicks * tickTime
              });
            }

            const jsonStr = JSON.stringify(result, null, 2);
            const outputName = entry.name.replace(/\.mid$/, ".json");
            zip.file(outputName, jsonStr);

            const li = document.createElement("li");
            li.textContent = `✅ 已添加：${outputName}`;
            fileList.appendChild(li);
            processedCount++;
          } catch (err) {
            console.error("解析失败:", entry.name, err);
          }
        }
      }

      if (processedCount > 0) {
        const blob = await zip.generateAsync({ type: "blob" });
        const zipUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = zipUrl;
        a.download = "midi_json_batch.zip";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } else {
        alert("未找到任何 MIDI 文件或处理失败。");
      }
    };

    selectSingleBtn.onclick = async () => {
      try {
        const [fileHandle] = await window.showOpenFilePicker({
          types: [{ description: "MIDI 文件", accept: { "audio/midi": [".mid"] } }],
          multiple: false
        });

        const file = await fileHandle.getFile();
        const arrayBuffer = await file.arrayBuffer();
        const midi = new Midi(arrayBuffer);
        const jsonData = midi.toJSON();

        const meta = jsonData.header.meta?.filter(item => item.type === "marker") || [];
        const metaList = meta.map(item => ({ text: item.text, ticks: item.ticks }));
        const ppq = jsonData.header.ppq;
        const bpm = jsonData.header.tempos?.[0]?.bpm || 120;
        const name = jsonData.header.name || file.name;
        const tickTime = 60 / (bpm * ppq);

        const result = {
          name: name,
          audio_name: file.name,
          count: metaList.length,
          chords: []
        };

        for (let i = 0; i < metaList.length; i++) {
          const current = metaList[i];
          const nextTicks = metaList[i + 1]?.ticks || current.ticks + ppq;
          result.chords.push({
            name: current.text,
            time_start: current.ticks * tickTime,
            time_end: nextTicks * tickTime
          });
        }

        const jsonStr = JSON.stringify(result, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(/\.mid$/, ".json");
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        const li = document.createElement("li");
        li.textContent = `✅ 单文件已处理并下载：${a.download}`;
        fileList.appendChild(li);
      } catch (err) {
        console.error("选择或解析单文件失败：", err);
      }
    };
  </script>
</body>
</html>
