<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>MIDI 转 JSON</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      margin: 0;
      padding-top: 60px;
    }

    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    #fileInput {
      display: none;
    }

    label[for="fileInput"] {
      background-color: #4a90e2;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      text-align: center;
      transition: background-color 0.3s;
    }

    label[for="fileInput"]:hover {
      background-color: #357ab8;
    }

    ul#fileList {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
    }

    ul#fileList li {
      margin-bottom: 10px;
      background: #f7f9fc;
      padding: 10px 14px;
      border-left: 4px solid #4a90e2;
      border-radius: 6px;
      font-size: 14px;
    }

    ul#fileList li a {
      text-decoration: none;
      color: #4a90e2;
      font-weight: 500;
    }

    ul#fileList li a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 MIDI 转 JSON</h1>
    <label for="fileInput">📄 选择 MIDI 文件</label>
    <input type="file" id="fileInput" accept=".mid" />
    <ul id="fileList"></ul>
  </div>

  <!-- Tone.js MIDI parser -->
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  <script>
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !file.name.endsWith(".mid")) {
        alert("请选择一个 .mid 文件！");
        return;
      }

      const arrayBuffer = await file.arrayBuffer();

      try {
        const midi = new Midi(arrayBuffer);
        const json = JSON.stringify(midi.toJSON(), null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        fileList.innerHTML = ""; // 清空旧结果
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(/\.mid$/, ".json");
        a.textContent = `下载：${a.download}`;
        li.appendChild(a);
        fileList.appendChild(li);
      } catch (err) {
        console.error("解析失败:", err);
        alert("解析失败，请检查文件格式是否正确");
      }
    };
  </script>
</body>
</html>
